<style>
/* Layout: één kolom, schoolbord-look (bewust één donker thema), live scorebord bovenaan tijdens het spel */
:root {
  --board: #17302a;
  --board-2: #1f3d35;
  --line: #2f5448;
  --chalk: #f3efe2;
  --chalk-dim: #b9c4b8;
  --accent: #f2b53a;
  --accent-ink: #231a05;
  --good: #5fd08a;
  --bad: #ff7a6b;
  --font-display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--board); color: var(--chalk);
  font-family: var(--font-body); font-size: 18px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: clamp(2.4rem, 9vw, 3.6rem); font-weight: 800; letter-spacing: -0.02em; }
h1 span { color: var(--accent); }
h2 { font-size: clamp(1.6rem, 6vw, 2.2rem); font-weight: 800; }
.eyebrow { font-size: .8rem; text-transform: uppercase; letter-spacing: .14em; color: var(--chalk-dim); font-weight: 700; }
.muted { color: var(--chalk-dim); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
button { font: inherit; cursor: pointer; border: 0; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn {
  min-height: 60px; padding: 14px 20px; border-radius: 14px; font-weight: 700; font-size: 1.15rem;
  background: var(--board-2); border: 2px solid var(--line); color: var(--chalk);
  transition: transform .08s ease, background .15s ease;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.good { background: var(--good); color: #0b2415; border-color: var(--good); }
.btn.bad { background: var(--bad); color: #2a0b07; border-color: var(--bad); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .35; cursor: not-allowed; }
.grow { flex: 1 1 0; min-width: 0; }

/* Setup */
.player-row { display: flex; gap: 8px; align-items: center; }
.player-row .num { width: 2ch; font-family: var(--font-display); font-weight: 800; color: var(--accent); font-size: 1.3rem; text-align: right; font-variant-numeric: tabular-nums; }
.player-row input {
  flex: 1; min-width: 0; min-height: 56px; font: inherit; font-size: 1.15rem; padding: 10px 14px;
  background: var(--board-2); color: var(--chalk); border: 2px solid var(--line); border-radius: 12px;
}
.player-row input::placeholder { color: var(--chalk-dim); opacity: .7; }
.x { width: 52px; min-height: 56px; border-radius: 12px; background: transparent; border: 2px solid var(--line); color: var(--chalk-dim); font-size: 1.4rem; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; }
.seg button { min-height: 52px; border-radius: 12px; background: var(--board-2); border: 2px solid var(--line); font-weight: 700; font-size: 1.05rem; padding: 8px; }
.seg button[aria-pressed="true"] { background: var(--chalk); color: var(--board); border-color: var(--chalk); }
.panel { border: 2px dashed var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.err { color: var(--bad); font-weight: 700; min-height: 1.4em; }

/* Scorebord */
.scores { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: var(--board-2); border: 2px solid var(--line); font-weight: 700; white-space: nowrap; }
.chip b { font-family: var(--font-display); font-variant-numeric: tabular-nums; color: var(--accent); font-size: 1.1rem; }
.chip.now { border-color: var(--accent); background: #2b3d24; }
.chip .j { font-size: .7rem; letter-spacing: .08em; padding: 2px 6px; border-radius: 6px; background: var(--line); color: var(--chalk-dim); }
.bump { animation: bump .5s ease; }
@keyframes bump { 40% { transform: scale(1.12); } }

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.progress { height: 6px; background: var(--board-2); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }

.turn { display: flex; flex-direction: column; gap: 4px; }
.turn .who { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 10vw, 3.4rem); color: var(--accent); line-height: 1; word-break: break-word; }

.cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cat { min-height: 88px; border-radius: 16px; padding: 12px; text-align: left; background: var(--board-2); border: 2px solid var(--line); display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
.cat strong { font-family: var(--font-display); font-size: 1.25rem; line-height: 1.1; }
.cat small { color: var(--chalk-dim); font-size: .85rem; }
.cat .ico { font-size: 1.6rem; line-height: 1; }
.cat[disabled] { opacity: .35; }

.qcard { background: var(--chalk); color: var(--board); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 0 #0d1d18; }
.qcard .meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .85rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #4b5d55; }
.qcard .q { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.4rem, 5.5vw, 1.9rem); line-height: 1.2; text-wrap: pretty; }
.opts { display: grid; gap: 10px; }
.opt { min-height: 64px; text-align: left; padding: 12px 16px; border-radius: 14px; background: var(--board-2); border: 2px solid var(--line); font-size: 1.15rem; font-weight: 700; display: flex; gap: 12px; align-items: center; }
.opt .l { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--line); font-family: var(--font-display); }
.opt.correct { background: var(--good); color: #0b2415; border-color: var(--good); }
.opt.correct .l { background: #0b241522; }
.opt.wrong { background: var(--bad); color: #2a0b07; border-color: var(--bad); }
.opt.wrong .l { background: #2a0b0722; }
.opt.gone { opacity: .2; text-decoration: line-through; }
.opt[disabled] { cursor: default; }

.reveal { border-radius: 16px; padding: 16px; background: var(--board-2); border: 2px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.reveal .ans { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; color: var(--accent); }
.verdict { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; }
.verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }

/* Einde */
.podium { display: flex; flex-direction: column; gap: 8px; }
.rank { display: grid; grid-template-columns: 2.5ch 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 14px; background: var(--board-2); border: 2px solid var(--line); }
.rank .p { font-family: var(--font-display); font-weight: 800; color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
.rank .n { font-weight: 700; font-size: 1.15rem; min-width: 0; overflow-wrap: anywhere; }
.rank .s { font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.rank.first { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.rank.first .p { color: var(--accent-ink); }
.winner { text-align: center; display: flex; flex-direction: column; gap: 6px; padding-block: 12px; }
.winner .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.4rem, 11vw, 4rem); color: var(--accent); line-height: 1; overflow-wrap: anywhere; }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.linkbtn { background: none; color: var(--chalk-dim); text-decoration: underline; padding: 8px 4px; font-size: .95rem; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

  { id: "muz", name: "Muziek", ico: "🎵", qs: [

    ["Wie zong 'Like a Prayer' (1989)?", "Madonna", ["Cyndi Lauper", "Whitney Houston", "Janet Jackson"]],
    ["In welke band spelen Mick Jagger en Keith Richards?", "The Rolling Stones", ["The Who", "The Kinks", "The Doors"]],
    ["Uit welk land komt Måneskin, winnaar van het Songfestival 2021?", "Italië", ["Zweden", "Spanje", "Frankrijk"]],
    ["Welk Italiaans muziekwoord betekent 'zacht'?", "Piano", ["Forte", "Allegro", "Largo"]],
    ["Welke Duitse band zingt 'Du hast'?", "Rammstein", ["Scorpions", "Kraftwerk", "Tokio Hotel"]],
    ["Wie zong 'Rolling in the Deep'?", "Adele", ["Amy Winehouse", "Duffy", "Florence Welch"]],
  ]},
];

// ---------- Hulpjes ----------
const MAX_PLAYERS = 10;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const qid = (c, i) => c + ":" + i;
const LETTERS = "ABCD";

// ---------- Toestand ----------
let S = {
  screen: "setup",
  names: ["", ""],
  perPlayer: 5,
  mode: "kies",          // "kies" of "draai"
  players: [],           // {name, score, joker, right}
  turn: 0,
  roundUsed: [],         // ids gebruikt in deze ronde
  seen: [],              // ids gezien in eerdere rondes (om herhaling te beperken)
  q: null,               // {cat, idx, opts, removed, picked, result}
  confirmQuit: false,
  bumped: -1,
};

function loadNames() {
  try { const n = JSON.parse(localStorage.getItem("cafequiz-names") || "null"); if (Array.isArray(n) && n.length) S.names = n.slice(0, MAX_PLAYERS); } catch (e) {}
}
function saveNames() { try { localStorage.setItem("cafequiz-names", JSON.stringify(S.names)); } catch (e) {} }

const totalTurns = () => S.players.length * S.perPlayer;
const current = () => S.players[S.turn % S.players.length];
const remaining = ci => CATS[ci].qs.filter((_, i) => !S.roundUsed.includes(qid(ci, i))).length;

function rotatingCat() {
  const n = S.players.length;
  let ci = (S.turn + Math.floor(S.turn / n)) % CATS.length;
  for (let k = 0; k < CATS.length; k++) { const c = (ci + k) % CATS.length; if (remaining(c) > 0) return c; }
  return -1;
}

function pickQuestion(ci) {
  const cat = CATS[ci];
  let pool = cat.qs.map((_, i) => i).filter(i => !S.roundUsed.includes(qid(ci, i)));
  if (!pool.length) return;
  const fresh = pool.filter(i => !S.seen.includes(qid(ci, i)));
  if (fresh.length) pool = fresh;
  const idx = pool[Math.floor(Math.random() * pool.length)];
  const raw = cat.qs[idx];
  S.roundUsed.push(qid(ci, idx));
  S.q = { cat: ci, idx, opts: raw[2] ? shuffle([raw[1], ...raw[2]]) : null, removed: [], picked: null, result: null, shown: false };
  S.screen = "question";
  render();
}

// ---------- Acties ----------
function startGame(keepScores) {
  if (!keepScores) {
    const names = S.names.map(n => n.trim()).filter(Boolean);
    S.players = names.map(name => ({ name, score: 0, joker: true, right: 0 }));
  } else {
    S.players.forEach(p => { p.score = 0; p.joker = true; p.right = 0; });
  }
  S.seen = S.seen.concat(S.roundUsed);
  // als een categorie volledig gezien is, die categorie opnieuw vrijgeven
  CATS.forEach((c, ci) => { if (c.qs.every((_, i) => S.seen.includes(qid(ci, i)))) S.seen = S.seen.filter(id => !id.startsWith(ci + ":")); });
  S.roundUsed = []; S.turn = 0; S.q = null; S.confirmQuit = false;
  S.players = shuffle(S.players);
  S.screen = "turn";
  render();
}

function answer(opt) {
  const q = S.q, raw = CATS[q.cat].qs[q.idx];
  if (q.result) return;
  q.picked = opt;
  q.result = opt === raw[1] ? "ok" : "no";
  const p = current();
  if (q.result === "ok") { p.score += 1; p.right++; S.bumped = S.turn % S.players.length; }
  render();
}

function judgeOpen(ok) {
  const q = S.q;
  if (q.result) return;
  q.result = ok ? "ok" : "no";
  const p = current();
  if (ok) { p.score += 2; p.right++; S.bumped = S.turn % S.players.length; }
  render();
}

function useJoker() {
  const q = S.q, raw = CATS[q.cat].qs[q.idx], p = current();
  if (!p.joker || !q.opts || q.result) return;
  p.joker = false;
  q.removed = shuffle(raw[2]).slice(0, 2);
  render();
}

function nextTurn() {
  S.turn++; S.q = null; S.bumped = -1;
  const anyLeft = CATS.some((_, ci) => remaining(ci) > 0);
  S.screen = S.turn >= totalTurns() || !anyLeft ? "end" : "turn";
  render();
}

// ---------- Weergave ----------
function scoreboard() {
  const cur = S.turn % S.players.length;
  return `<div class="scores" aria-label="Scorebord">${S.players.map((p, i) => `
    <div class="chip ${i === cur && S.screen !== "end" ? "now" : ""} ${i === S.bumped ? "bump" : ""}">
      <span>${esc(p.name)}</span><b>${p.score}</b>${p.joker ? `<span class="j" title="50/50-joker nog beschikbaar">50/50</span>` : ""}
    </div>`).join("")}</div>`;
}

function header() {
  const pct = Math.min(100, (S.turn / totalTurns()) * 100);
  const qnum = Math.floor(S.turn / S.players.length) + 1;
  return `
    <div class="topbar">
      <span class="eyebrow">Beurt ${Math.min(S.turn + 1, totalTurns())} / ${totalTurns()} · vraag ${Math.min(qnum, S.perPlayer)} per speler</span>
      ${S.confirmQuit
        ? `<span class="confirm"><span class="muted">Stoppen?</span><button class="linkbtn" data-a="quit-yes">Ja, naar uitslag</button><button class="linkbtn" data-a="quit-no">Nee</button></span>`
        : `<button class="linkbtn" data-a="quit">Stop ronde</button>`}
    </div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    ${scoreboard()}`;
}

function viewSetup() {
  const canAdd = S.names.length < MAX_PLAYERS;
  return `
    <header class="stack">
      <span class="eyebrow">Zes categorieën · tot ${MAX_PLAYERS} spelers</span>
      <h1>Café<span>quiz</span></h1>
      <p class="muted" style="margin:0">Geef de gsm door. Meerkeuze = 1 punt, open vraag = 2 punten. Iedereen krijgt één 50/50-joker per ronde.</p>
    </header>
    <section class="stack" aria-label="Spelers">
      <h3 class="eyebrow">Spelers (${S.names.length}/${MAX_PLAYERS})</h3>
      ${S.names.map((n, i) => `
        <div class="player-row">
          <span class="num">${i + 1}</span>
          <input id="p${i}" data-i="${i}" value="${esc(n)}" placeholder="Naam speler ${i + 1}" maxlength="20" autocomplete="off" enterkeyhint="next">
          ${S.names.length > 1 ? `<button class="x" data-a="del" data-i="${i}" aria-label="Verwijder speler ${i + 1}">×</button>` : ""}
        </div>`).join("")}
      <button class="btn block" data-a="add" ${canAdd ? "" : "disabled"}>+ Speler toevoegen</button>
    </section>
    <section class="panel">
      <div class="stack">
        <span class="eyebrow">Vragen per speler</span>
        <div class="seg">${[3, 5, 7, 10].map(n => `<button data-a="per" data-v="${n}" aria-pressed="${S.perPlayer === n}">${n}</button>`).join("")}</div>
      </div>
      <div class="stack">
        <span class="eyebrow">Categorie</span>
        <div class="seg">
          <button data-a="mode" data-v="kies" aria-pressed="${S.mode === "kies"}">Speler kiest</button>
          <button data-a="mode" data-v="draai" aria-pressed="${S.mode === "draai"}">Automatisch afwisselen</button>
        </div>
      </div>
    </section>
    <div class="err" id="err" role="alert"></div>
    <button class="btn primary block" data-a="start" style="min-height:72px;font-size:1.35rem">Start quiz ▶</button>`;
}

function viewTurn() {
  const p = current();
  const auto = S.mode === "draai" ? rotatingCat() : -1;
  return `
    ${header()}
    <div class="turn">
      <span class="eyebrow">Aan de beurt</span>
      <div class="who">${esc(p.name)}</div>
      <span class="muted">${p.score} ${p.score === 1 ? "punt" : "punten"}${p.joker ? " · 50/50-joker nog beschikbaar" : ""}</span>
    </div>
    ${S.mode === "draai" && auto >= 0 ? `
      <div class="cat" style="min-height:auto;padding:18px">
        <span class="eyebrow">Categorie</span>
        <strong style="font-size:1.8rem">${CATS[auto].ico} ${CATS[auto].name}</strong>
      </div>
      <button class="btn primary block" data-a="pick" data-c="${auto}" style="min-height:72px">Toon de vraag</button>`
    : `
      <span class="eyebrow">Kies een categorie</span>
      <div class="cats">${CATS.map((c, ci) => { const r = remaining(ci); return `
        <button class="cat" data-a="pick" data-c="${ci}" ${r ? "" : "disabled"}>
          <span class="ico" aria-hidden="true">${c.ico}</span>
          <strong>${c.name}</strong>
          <small>${r ? r + " vragen over" : "op voor deze ronde"}</small>
        </button>`; }).join("")}</div>`}`;
}

function viewQuestion() {
  const q = S.q, cat = CATS[q.cat], raw = cat.qs[q.idx], p = current();
  const isOpen = !q.opts;
  let body = "";
  if (!isOpen) {
    body = `<div class="opts">${q.opts.map((o, i) => {
      let cls = "opt";
      if (q.removed.includes(o)) cls += " gone";
      if (q.result) { if (o === raw[1]) cls += " correct"; else if (o === q.picked) cls += " wrong"; }
      return `<button class="${cls}" data-a="ans" data-o="${i}" ${q.result || q.removed.includes(o) ? "disabled" : ""}><span class="l">${LETTERS[i]}</span><span>${esc(o)}</span></button>`;
    }).join("")}</div>
    ${!q.result ? `<button class="btn block" data-a="joker" ${p.joker ? "" : "disabled"}>${p.joker ? "Gebruik 50/50-joker (1× per ronde)" : "Joker al gebruikt"}</button>` : ""}`;
  } else if (!q.shown) {
    body = `<p class="muted" style="margin:0">Open vraag. ${esc(p.name)} zegt het antwoord luidop, daarna toon je het juiste antwoord.</p>
      <button class="btn primary block" data-a="show" style="min-height:72px">Toon antwoord</button>`;
  } else {
    body = `<div class="reveal"><span class="eyebrow">Juist antwoord</span><span class="ans">${esc(raw[1])}</span></div>
      ${!q.result ? `<span class="muted">Had ${esc(p.name)} het goed? De groep beslist.</span>
      <div class="row"><button class="btn good grow" data-a="open-ok">Goed (+2)</button><button class="btn bad grow" data-a="open-no">Fout</button></div>` : ""}`;
  }
  let verdict = "";
  if (q.result) {
    verdict = `<div class="verdict ${q.result}">${q.result === "ok" ? `Juist! +${isOpen ? 2 : 1}` : `Helaas${isOpen ? "" : ", het was: " + esc(raw[1])}`}</div>
      <button class="btn primary block" data-a="next" style="min-height:72px">${S.turn + 1 >= totalTurns() ? "Naar de uitslag 🏆" : "Volgende: " + esc(S.players[(S.turn + 1) % S.players.length].name) + " ▶"}</button>`;
  }
  return `
    ${header()}
    <article class="qcard">
      <div class="meta"><span>${cat.ico} ${cat.name}</span><span>${esc(p.name)} · ${isOpen ? "open · 2 ptn" : "meerkeuze · 1 pt"}</span></div>
      <div class="q">${esc(raw[0])}</div>
    </article>
    ${body}
    ${verdict}`;
}

function viewEnd() {
  const ranked = S.players.slice().sort((a, b) => b.score - a.score || b.right - a.right);
  const top = ranked[0]?.score ?? 0;
  const winners = ranked.filter(p => p.score === top);
  let place = 0, prev = null;
  return `
    <div class="winner">
      <span class="eyebrow">${winners.length > 1 ? "Gedeelde winst" : "Winnaar"}</span>
      <div class="big">${winners.map(w => esc(w.name)).join(" & ")}</div>
      <span class="muted">${top} ${top === 1 ? "punt" : "punten"}</span>
    </div>
    <div class="podium">${ranked.map((p, i) => {
      if (p.score !== prev) { place = i + 1; prev = p.score; }
      return `<div class="rank ${p.score === top ? "first" : ""}"><span class="p">${place}.</span><span class="n">${esc(p.name)} <span class="muted" style="font-weight:400;font-size:.9rem;${p.score === top ? "color:inherit;opacity:.7" : ""}">· ${p.right} juist</span></span><span class="s">${p.score}</span></div>`;
    }).join("")}</div>
    <button class="btn primary block" data-a="again" style="min-height:72px">Nieuwe ronde, zelfde spelers</button>
    <button class="btn block" data-a="setup">Spelers aanpassen</button>`;
}

function render() {
  const app = $("#app");
  app.innerHTML = { setup: viewSetup, turn: viewTurn, question: viewQuestion, end: viewEnd }[S.screen]();
  window.scrollTo({ top: 0 });
}

// ---------- Events ----------
document.addEventListener("input", e => {
  if (e.target.matches(".player-row input")) { S.names[+e.target.dataset.i] = e.target.value; saveNames(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches(".player-row input")) {
    const i = +e.target.dataset.i, nxt = $("#p" + (i + 1));
    if (nxt) nxt.focus();
    else if (S.names.length < MAX_PLAYERS && e.target.value.trim()) { S.names.push(""); render(); $("#p" + (i + 1))?.focus(); }
  }
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b || b.disabled) return;
  const a = b.dataset.a;
  if (a === "add") { if (S.names.length < MAX_PLAYERS) { S.names.push(""); saveNames(); render(); $("#p" + (S.names.length - 1))?.focus(); } }
  else if (a === "del") { S.names.splice(+b.dataset.i, 1); saveNames(); render(); }
  else if (a === "per") { S.perPlayer = +b.dataset.v; render(); }
  else if (a === "mode") { S.mode = b.dataset.v; render(); }
  else if (a === "start") {
    const names = S.names.map(n => n.trim()).filter(Boolean);
    const dup = names.find((n, i) => names.findIndex(m => m.toLowerCase() === n.toLowerCase()) !== i);
    if (!names.length) { $("#err").textContent = "Vul minstens één naam in."; return; }
    if (dup) { $("#err").textContent = `"${dup}" staat er twee keer in. Maak de namen uniek.`; return; }
    S.names = names; saveNames(); startGame(false);
  }
  else if (a === "pick") pickQuestion(+b.dataset.c);
  else if (a === "ans") answer(S.q.opts[+b.dataset.o]);
  else if (a === "joker") useJoker();
  else if (a === "show") { S.q.shown = true; render(); }
  else if (a === "open-ok") judgeOpen(true);
  else if (a === "open-no") judgeOpen(false);
  else if (a === "next") nextTurn();
  else if (a === "quit") { S.confirmQuit = true; render(); }
  else if (a === "quit-no") { S.confirmQuit = false; render(); }
  else if (a === "quit-yes") { S.confirmQuit = false; S.screen = "end"; render(); }
  else if (a === "again") startGame(true);
  else if (a === "setup") { S.names = S.players.map(p => p.name); S.screen = "setup"; render(); }
});

// ---------- Start (behoudt spelstand bij een update van de pagina) ----------
function start(data) {
  if (data && data.state) S = Object.assign(S, data.state); else loadNames();
  render();
}
window.claude?.hot?.snapshot?.(() => ({ state: S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
